
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        input[type="text"] {
            padding: 10px;
            margin-right: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
        }
        .task-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 5px;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .task-item.completed {
            background-color: #e6f7e6;
            text-decoration: line-through;
            color: #888;
        }
        .task-actions button {
           margin-left: 5px;
            padding: 5px 10px;
        }
        .task-actions button:first-child {
          margin-left: 0;
        }
        @media (max-width: 768px) {
            .container {
                width: 95%;
            }
            input[type="text"] {
               width: 60%;
                margin-bottom: 10px;
           }
           .task-item {
             flex-direction: column;
             align-items: flex-start;
           }
           .task-actions {
               margin-top: 10px;
               margin-bottom: 5px;
           }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>
        <div>
            <input type="text" id="newTask" placeholder="Add new task">
            <button onclick="addTask()">Add</button>
        </div>
        <ul class="task-list" id="taskList">
           <!-- Task items will be added here by JavaScript -->
        </ul>
    </div>
    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        const taskList = document.getElementById('taskList');
        const newTaskInput = document.getElementById('newTask');

        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                const taskItem = document.createElement('li');
                taskItem.classList.add('task-item');
                if (task.completed) {
                    taskItem.classList.add('completed');
                }

                taskItem.innerHTML = `
                    <span>${task.description}</span>
                     <div class="task-actions">
                        <button onclick="toggleComplete(${index})">${task.completed ? 'Unmark' : 'Mark'}</button>
                        <button onclick="editTask(${index})">Edit</button>
                         <button onclick="deleteTask(${index})">Delete</button>
                     </div>
                   `;

                taskList.appendChild(taskItem);
            });
        }

        function addTask() {
            const newTaskDescription = newTaskInput.value.trim();
            if (newTaskDescription) {
                tasks.push({ description: newTaskDescription, completed: false });
                newTaskInput.value = '';
                updateLocalStorage();
                renderTasks();
            }
        }

         function toggleComplete(index) {
             tasks[index].completed = !tasks[index].completed;
             updateLocalStorage();
             renderTasks();
        }
       function editTask(index) {
            const taskItem = taskList.children[index];
            const taskTextSpan = taskItem.querySelector('span');
            const currentTaskText = taskTextSpan.textContent;

            const editInput = document.createElement('input');
            editInput.type = 'text';
            editInput.value = currentTaskText;
            taskTextSpan.replaceWith(editInput);
            editInput.focus();

            const saveEdit = () => {
                 const newText = editInput.value.trim();
                 if(newText) {
                      tasks[index].description = newText;
                      updateLocalStorage();
                      renderTasks();
                 }
                else{
                  taskTextSpan.textContent = currentTaskText;
                  editInput.replaceWith(taskTextSpan);
                }
            };
          editInput.addEventListener('blur',saveEdit);
          editInput.addEventListener('keydown', (event)=>{
            if(event.key === 'Enter'){
             saveEdit();
            }
          })

        }
        function deleteTask(index) {
           tasks.splice(index, 1);
            updateLocalStorage();
           renderTasks();
        }
        function updateLocalStorage() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

         renderTasks();
    </script>
</body>
</html>
