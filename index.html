
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        .container {
            width: 80%;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
        }
      
        #auth-container{
          display: flex;
          flex-direction: column;
          align-items: center;
          margin-bottom: 20px;
        }
        
        #auth-container input{
          margin-bottom: 10px;
          padding: 10px;
          border-radius: 4px;
          border: 1px solid #ddd;
        }
        
        #auth-container button {
            background-color: #5cb85c;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .task-form, .filter-sort {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .task-form input, .task-form select, .filter-sort select {
          padding: 10px;
          border-radius: 4px;
          border: 1px solid #ddd;
        }

        .task-form button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
       
       .filter-sort select{
         padding: 10px;
       }
       
        .task-list {
            list-style: none;
            padding: 0;
        }

        .task-item {
            background-color: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            
        }
        
        .task-item.completed{
            background-color: #dff0d8;
            border-color: #d0e9c6;
        }
        
        .task-item.pending{
          
        }
        
        .task-item.in-progress{
          background-color:#f0f7ff;
          border-color:#d5e5ff;
        }
        
        .task-item span{
          flex:1;
          text-align: left;
        }

        .task-actions button {
            background-color: #5bc0de;
            color: white;
            padding: 8px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }
        .task-actions button:first-child{
            margin-left: 0;
        }
        .task-actions button.delete-btn{
            background-color:#d9534f;
        }
        
        .task-item div {
           display: flex;
           align-items: center;
        }
       
        @media (max-width: 768px) {
            .container {
                width: 95%;
            }
             .task-form, .filter-sort {
               flex-direction: column;
             }
              .task-form button {
                width: 100%;
              }
        }
    </style>
</head>
<body>
    <div class="container">
       <h1>To-Do List</h1>
        <div id="auth-container">
            <h2>Authentication</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button id="loginBtn">Log In</button>
            <button id="registerBtn">Register</button>
        </div>

        <h2>Create Task</h2>
        <div class="task-form">
            <input type="text" id="taskTitle" placeholder="Task Title" required>
            <textarea id="taskDescription" placeholder="Description"></textarea>
            <input type="date" id="taskDueDate">
            <select id="taskPriority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
             <select id="taskCategory">
                <option value="work">Work</option>
                <option value="personal">Personal</option>
                <option value="shopping">Shopping</option>
            </select>
            <button id="addTaskBtn">Add Task</button>
        </div>
        
        <h2>Filter & Sort Tasks</h2>
        <div class="filter-sort">
            <select id="filterCategory">
                <option value="">All Categories</option>
                <option value="work">Work</option>
                <option value="personal">Personal</option>
                <option value="shopping">Shopping</option>
            </select>
             <select id="filterStatus">
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
            </select>
            <select id="sortTasks">
                <option value="dueDate">Due Date</option>
                 <option value="priority">Priority</option>
            </select>
        </div>
        

        <h2>Task List</h2>
        <ul id="taskList" class="task-list">
            <!-- Tasks will be appended here -->
        </ul>
    </div>
    <script>
      
      let isLoggedIn = false;
      
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const loginButton = document.getElementById('loginBtn');
      const registerButton = document.getElementById('registerBtn');
      const authContainer = document.getElementById('auth-container');

        const taskTitleInput = document.getElementById('taskTitle');
        const taskDescriptionInput = document.getElementById('taskDescription');
        const taskDueDateInput = document.getElementById('taskDueDate');
        const taskPrioritySelect = document.getElementById('taskPriority');
         const taskCategorySelect = document.getElementById('taskCategory');
        const addTaskButton = document.getElementById('addTaskBtn');
         const filterCategorySelect = document.getElementById('filterCategory');
         const filterStatusSelect = document.getElementById('filterStatus');
         const sortTasksSelect = document.getElementById('sortTasks');

        const taskList = document.getElementById('taskList');

        let tasks = [];
         
        const loadTasks = () => {
             const storedTasks = localStorage.getItem('tasks');
              if(storedTasks){
                tasks = JSON.parse(storedTasks);
                renderTasks();
              }
           };
           
          const saveTasks = () => {
            localStorage.setItem('tasks', JSON.stringify(tasks));
          }

         const renderTasks = () => {
            taskList.innerHTML = '';
            let filteredTasks = [...tasks];
             
            //Filter Tasks
           const filterCategory = filterCategorySelect.value;
           const filterStatus = filterStatusSelect.value;
            if (filterCategory){
               filteredTasks = filteredTasks.filter(task => task.category === filterCategory);
            }
             if (filterStatus){
               filteredTasks = filteredTasks.filter(task => task.status === filterStatus);
            }
             
            // Sort tasks
            const sortBy = sortTasksSelect.value;
            if (sortBy === 'dueDate'){
               filteredTasks.sort((a,b) => {
                const dateA = a.dueDate ? new Date(a.dueDate) : new Date('9999-12-31');
                const dateB = b.dueDate ? new Date(b.dueDate) : new Date('9999-12-31');
                return dateA - dateB;
               });
            }else if (sortBy === 'priority'){
               const priorityOrder = { high: 1, medium: 2, low: 3 };
                filteredTasks.sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);
            }
            
            filteredTasks.forEach((task, index) => {
                const taskItem = document.createElement('li');
                taskItem.classList.add('task-item');
                taskItem.classList.add(task.status)
                 
                taskItem.innerHTML = `
                  <span>${task.title}</span>
                  <div>
                    <button class="status-btn" data-id="${index}">${task.status}</button>
                    <button class="edit-btn" data-id="${index}">Edit</button>
                    <button class="delete-btn" data-id="${index}">Delete</button>
                    </div>
                   
                `;
                taskList.appendChild(taskItem);
            });
         };
          
          const addTask = () => {
              if (!isLoggedIn) {
                alert("Please log in to create tasks.");
                return;
              }
             
            const title = taskTitleInput.value.trim();
            if(!title) return;
             
            const newTask = {
                title: title,
                description: taskDescriptionInput.value,
                dueDate: taskDueDateInput.value,
                priority: taskPrioritySelect.value,
                category: taskCategorySelect.value,
                status: 'pending'
            };
            tasks.push(newTask);
             saveTasks();
             taskTitleInput.value = '';
              taskDescriptionInput.value = '';
               taskDueDateInput.value = '';
            renderTasks();
        };
        
        const handleTaskActions = (event) => {
              const target = event.target;
              const taskIndex = target.dataset.id;
              
               if (target.classList.contains('delete-btn')){
                   tasks.splice(taskIndex, 1);
                   saveTasks();
                   renderTasks();
               }else if (target.classList.contains('edit-btn')){
                   
                const currentTask = tasks[taskIndex];
                taskTitleInput.value = currentTask.title;
                taskDescriptionInput.value = currentTask.description;
                taskDueDateInput.value = currentTask.dueDate;
                taskPrioritySelect.value = currentTask.priority;
                taskCategorySelect.value = currentTask.category;
                
                tasks.splice(taskIndex,1);
                saveTasks();
                renderTasks();
              
               }else if (target.classList.contains('status-btn')){
                   
                 let currentStatus = tasks[taskIndex].status;
                   if(currentStatus === 'pending'){
                       tasks[taskIndex].status = 'in-progress';
                   }else if(currentStatus === 'in-progress'){
                      tasks[taskIndex].status = 'completed';
                   }else if(currentStatus === 'completed'){
                       tasks[taskIndex].status = 'pending';
                   }
                  saveTasks();
                  renderTasks();
               }
        };
        
        
       // Authentication functionality
       const handleLogin = () => {
          const username = usernameInput.value;
          const password = passwordInput.value;
          if (username === 'test' && password === '123'){
              isLoggedIn = true;
              authContainer.style.display = 'none';
          }else{
            alert("Invalid username or password");
          }
       };

       const handleRegister = () => {
         const username = usernameInput.value;
         const password = passwordInput.value;
         if(username && password){
            localStorage.setItem('registeredUser', JSON.stringify({username,password}));
             alert("Registration successful. Please log in.");
         }else{
            alert("Please enter username and password");
         }
       };

        loginButton.addEventListener('click',handleLogin);
        registerButton.addEventListener('click',handleRegister);
        addTaskButton.addEventListener('click',addTask);
        taskList.addEventListener('click',handleTaskActions);
        
        filterCategorySelect.addEventListener('change',renderTasks);
        filterStatusSelect.addEventListener('change', renderTasks);
         sortTasksSelect.addEventListener('change', renderTasks);
         
        loadTasks();
       
    </script>
</body>
</html>
