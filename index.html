
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #0056b3;
        }
        .auth-form, #task-form{
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .auth-form label, #task-form label {
            margin-bottom: 5px;
        }
        .auth-form input, #task-form input, #task-form select, #task-form textarea{
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .auth-form button, #task-form button, .task button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .auth-form button:hover, #task-form button:hover, .task button:hover {
            background-color: #0056b3;
        }
        #task-list {
            list-style: none;
            padding: 0;
        }
        .task {
            background: #f9f9f9;
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task:last-child {
            border-bottom: none;
        }
        .task-details {
            flex-grow: 1;
            margin-right: 10px;
        }
        .task button{
            margin-left: 5px;
        }
        #filter-sort {
            margin-bottom: 20px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
        #filter-sort select{
            margin-left: 10px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
         @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 10px;
            }
            #filter-sort{
                flex-direction: column;
                align-items: flex-start;
            }
            #filter-sort select{
                margin: 10px 0px;
            }
             .task {
               flex-direction: column;
               align-items: flex-start;
            }
            .task-details {
                margin-bottom: 5px;
             }
             .task button{
                 margin: 5px 0px;
             }
        }

        .notification{
            background-color: #f0ad4e;
            color: white;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>
        <div id="auth-section">
            <h2>Authentication</h2>
            <form id="register-form" class="auth-form">
                <label for="register-username">Username:</label>
                <input type="text" id="register-username" required>
                <label for="register-password">Password:</label>
                <input type="password" id="register-password" required>
                <button type="submit">Register</button>
            </form>
            <form id="login-form" class="auth-form">
                <label for="login-username">Username:</label>
                <input type="text" id="login-username" required>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" required>
                <button type="submit">Login</button>
            </form>
        </div>
        <div id="app-section" style="display:none;">
          <h2>Add New Task</h2>
          <form id="task-form">
              <label for="task-name">Task Name:</label>
              <input type="text" id="task-name" required>
              <label for="task-description">Description:</label>
              <textarea id="task-description"></textarea>
              <label for="task-due-date">Due Date:</label>
              <input type="date" id="task-due-date">
              <label for="task-priority">Priority:</label>
              <select id="task-priority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
              <label for="task-category">Category:</label>
              <input type="text" id="task-category">
              <button type="submit">Add Task</button>
          </form>
          <div id="notification-area">
          </div>
          <div id="filter-sort">
            <label for="filter-category">Filter by Category:</label>
            <select id="filter-category">
              <option value="all">All</option>
            </select>
             <label for="sort-by">Sort by:</label>
            <select id="sort-by">
                <option value="due-date">Due Date</option>
                <option value="priority">Priority</option>
            </select>
          </div>
           <h2>Task List</h2>
           <ul id="task-list">
            </ul>
        </div>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
    const registerForm = document.getElementById('register-form');
    const loginForm = document.getElementById('login-form');
    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const taskForm = document.getElementById('task-form');
    const taskList = document.getElementById('task-list');
    const notificationArea = document.getElementById('notification-area');
    const filterCategory = document.getElementById('filter-category');
    const sortBy = document.getElementById('sort-by');
    let tasks = [];
     let user = null;


    function updateCategoryFilter(){
        const categories = [...new Set(tasks.map(task => task.category).filter(Boolean))];
        filterCategory.innerHTML = '<option value="all">All</option>';
        categories.forEach(category => {
            const option = document.createElement('option');
            option.value = category;
            option.textContent = category;
            filterCategory.appendChild(option);
        });
    }


    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function loadTasks() {
        const storedTasks = localStorage.getItem('tasks');
        if(storedTasks){
            tasks = JSON.parse(storedTasks);
            updateCategoryFilter();
            renderTasks();
        }
    }

      function loadUser(){
          const storedUser = localStorage.getItem('user');
          if(storedUser){
              user = JSON.parse(storedUser);
               authSection.style.display = 'none';
                appSection.style.display = 'block';
                loadTasks();
          }
      }


      function saveUser(user){
        localStorage.setItem('user', JSON.stringify(user));
      }

      loadUser();


    function renderTasks() {
            taskList.innerHTML = '';
            const filterValue = filterCategory.value;
            const sortValue = sortBy.value;
             let filteredTasks = [...tasks];

            if(filterValue !== 'all'){
                filteredTasks = filteredTasks.filter(task => task.category === filterValue);
            }

             filteredTasks.sort((a,b) => {
                  if(sortValue === 'due-date'){
                    const dateA = a.dueDate ? new Date(a.dueDate) : null;
                    const dateB = b.dueDate ? new Date(b.dueDate) : null;
                    if(dateA && dateB){
                     return dateA - dateB;
                    }
                     if(dateA){
                      return -1;
                     }
                    if(dateB){
                      return 1;
                    }
                    return 0;
                  }else if (sortValue === 'priority') {
                      const priorityValues = { high: 3, medium: 2, low: 1};
                      return priorityValues[b.priority] - priorityValues[a.priority];
                  }
                 return 0;

                });


            filteredTasks.forEach(task => {
                const taskItem = document.createElement('li');
                taskItem.classList.add('task');
                const detailsDiv = document.createElement('div');
                detailsDiv.classList.add('task-details');

                let taskDetailsHtml = `
                    <h3>${task.name}</h3>
                    <p><strong>Description:</strong> ${task.description || 'N/A'}</p>
                    <p><strong>Due Date:</strong> ${task.dueDate || 'N/A'}</p>
                    <p><strong>Priority:</strong> ${task.priority || 'N/A'}</p>
                    <p><strong>Category:</strong> ${task.category || 'N/A'}</p>
                    <p><strong>Status:</strong> ${task.status || 'Pending'}</p>
                `;

                detailsDiv.innerHTML = taskDetailsHtml;

                const editButton = document.createElement('button');
                editButton.textContent = 'Edit';
                editButton.onclick = () => editTask(task.id);

                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Delete';
                deleteButton.onclick = () => deleteTask(task.id);


                const statusButton = document.createElement('button');
                statusButton.textContent = task.status === 'Pending' ? 'Mark Complete' : 'Mark Pending';
                statusButton.onclick = () => updateTaskStatus(task.id);

                taskItem.appendChild(detailsDiv);
                taskItem.appendChild(editButton);
                taskItem.appendChild(statusButton);
                taskItem.appendChild(deleteButton);


                 taskList.appendChild(taskItem);
            });
        }

    function addTask(name, description, dueDate, priority, category) {
           const newTask = {
               id: Date.now(),
               name: name,
               description: description,
               dueDate: dueDate,
               priority: priority,
               category: category,
               status: 'Pending'
           };
            tasks.push(newTask);
             saveTasks();
            updateCategoryFilter();
            renderTasks();
            checkNotifications();
    }

    function editTask(taskId){
        const task = tasks.find(task => task.id === taskId);
            if (task) {
            const newName = prompt('Enter new task name:', task.name);
            const newDescription = prompt('Enter new description:', task.description);
             const newDueDate = prompt('Enter new due date:', task.dueDate);
            const newPriority = prompt('Enter new priority:', task.priority);
            const newCategory = prompt('Enter new category:', task.category);
                if (newName !== null && newName.trim() !== '') {
                    task.name = newName;
                    task.description = newDescription;
                    task.dueDate = newDueDate;
                    task.priority = newPriority;
                    task.category = newCategory;
                     saveTasks();
                     updateCategoryFilter();
                     renderTasks();
                     checkNotifications();
                }
            }
    }

     function deleteTask(taskId) {
         tasks = tasks.filter(task => task.id !== taskId);
          saveTasks();
          updateCategoryFilter();
          renderTasks();
          checkNotifications();
    }


    function updateTaskStatus(taskId){
        const task = tasks.find(task => task.id === taskId);
         if(task){
            task.status = task.status === 'Pending' ? 'Completed' : 'Pending';
             saveTasks();
             renderTasks();
         }
    }

      function checkNotifications(){
            const now = new Date();
            const upcomingTasks = tasks.filter(task => {
                if(!task.dueDate) return false;
                const dueDate = new Date(task.dueDate);
                const diffInDays = (dueDate - now) / (1000 * 60 * 60 * 24);
                return diffInDays > 0 && diffInDays <= 2 && task.status !== 'Completed'
            });
            const overdueTasks = tasks.filter(task => {
              if(!task.dueDate) return false;
               const dueDate = new Date(task.dueDate);
               return dueDate < now && task.status !== 'Completed';
            });

            notificationArea.innerHTML = '';

             upcomingTasks.forEach(task => {
                const notificationDiv = document.createElement('div');
                notificationDiv.classList.add('notification');
                notificationDiv.textContent = `Task "${task.name}" is due soon.`;
                notificationArea.appendChild(notificationDiv);

            });
             overdueTasks.forEach(task => {
                const notificationDiv = document.createElement('div');
                notificationDiv.classList.add('notification');
                notificationDiv.textContent = `Task "${task.name}" is overdue.`;
                notificationArea.appendChild(notificationDiv);
            });
      }

    registerForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('register-username').value;
        const password = document.getElementById('register-password').value;
        // Simple registration logic (no backend)
         user = {username: username, password: password};
         saveUser(user);
            authSection.style.display = 'none';
            appSection.style.display = 'block';
            loadTasks();
            alert('Registration successful');
     });

    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;
        // Simple login logic (no backend)
        if(user && user.username === username && user.password === password){
            authSection.style.display = 'none';
            appSection.style.display = 'block';
            loadTasks();
             alert('Login successful');
        }else{
             alert('Invalid credentials');
        }
    });

    taskForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const taskName = document.getElementById('task-name').value;
        const taskDescription = document.getElementById('task-description').value;
        const taskDueDate = document.getElementById('task-due-date').value;
        const taskPriority = document.getElementById('task-priority').value;
        const taskCategory = document.getElementById('task-category').value;
        addTask(taskName, taskDescription, taskDueDate, taskPriority, taskCategory);
        taskForm.reset();

    });

      filterCategory.addEventListener('change', renderTasks);
      sortBy.addEventListener('change', renderTasks);

       setInterval(checkNotifications, 60000);

});
    </script>
</body>
</html>
