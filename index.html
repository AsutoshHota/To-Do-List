
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #0056b3;
        }
         .auth-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;

         }
        .auth-form input {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 200px;
        }
        .auth-form button {
             padding: 10px 15px;
             background-color: #0056b3;
             color: white;
             border: none;
             border-radius: 4px;
             cursor: pointer;
        }

        .task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .task-form input, .task-form select, .task-form textarea {
           padding: 8px;
           border-radius: 4px;
           border: 1px solid #ccc;
        }

        .task-form button {
              padding: 8px 12px;
              background-color: #28a745;
              color: white;
              border: none;
              border-radius: 4px;
              cursor: pointer;
        }
        .task-form button:disabled {
             background-color: #ccc;
             cursor: not-allowed;

        }
        .task-list {
           list-style: none;
           padding: 0;
        }
        .task-list li {
            background-color: #f9f9f9;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
       .task-actions button {
          padding: 5px 10px;
          background-color: #dc3545;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          margin-left: 5px;
        }
       .task-actions button.edit {
           background-color: #ffc107;
           color: black;
       }
       .task-actions button.complete {
          background-color: #28a745;
       }
       .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
       .filters select {
           padding: 8px;
           border-radius: 4px;
           border: 1px solid #ccc;
       }
       .notifications {
           text-align: center;
           margin-top: 20px;
           color: red;
       }
      @media(max-width: 768px) {
          .container {
            width: 95%;
          }
          .task-form {
             flex-direction: column;
          }

          .task-form input, .task-form select, .task-form textarea, .filters select {
              width: 100%;
              margin-bottom: 5px;
          }
          .task-list li {
             flex-direction: column;
             align-items: flex-start;
             gap: 5px;
          }
           .task-actions {
              align-self: flex-end;
          }

        }
    </style>
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>

        <!-- Authentication Section -->
        <div id="authSection">
            <h2>Authentication</h2>
            <div class="auth-form" id="registerForm">
                <input type="text" id="registerUsername" placeholder="Username" required>
                <input type="password" id="registerPassword" placeholder="Password" required>
                <button id="registerButton">Register</button>
                <p id="registerError" style="color:red"></p>

            </div>
             <div class="auth-form" id="loginForm" style="display:none;">
                <input type="text" id="loginUsername" placeholder="Username" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button id="loginButton">Login</button>
                  <p id="loginError" style="color:red"></p>

            </div>
             <button id="toggleAuthForm">Switch to Login</button>
        </div>


        <!-- Task Management Section -->
        <div id="taskSection" style="display:none;">
            <h2>Add New Task</h2>
            <form class="task-form" id="taskForm">
                <input type="text" id="taskTitle" placeholder="Task Title" required>
                <textarea id="taskDescription" placeholder="Description"></textarea>
                <select id="taskCategory">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                </select>
                <input type="date" id="taskDueDate">
                 <select id="taskPriority">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
                <button id="addTaskButton">Add Task</button>
            </form>

            <h2>Task List</h2>
              <div class="filters">
                  <select id="filterCategory">
                    <option value="">All Categories</option>
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                </select>
                  <select id="filterPriority">
                    <option value="">All Priorities</option>
                     <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                  </select>
                  <select id="filterStatus">
                    <option value="">All Statuses</option>
                     <option value="Pending">Pending</option>
                     <option value="In Progress">In Progress</option>
                     <option value="Completed">Completed</option>
                </select>

                 <button id="clearFilters">Clear Filters</button>
             </div>
           <ul class="task-list" id="taskList"></ul>
        </div>

        <div class="notifications" id="notificationArea"></div>
    </div>

    <script>
        let tasks = [];
        let currentUser = null;

        const authSection = document.getElementById('authSection');
        const registerForm = document.getElementById('registerForm');
         const loginForm = document.getElementById('loginForm');
        const taskSection = document.getElementById('taskSection');
         const taskForm = document.getElementById('taskForm');
         const taskList = document.getElementById('taskList');
         const notificationArea = document.getElementById('notificationArea');
        const filterCategory = document.getElementById('filterCategory');
         const filterPriority = document.getElementById('filterPriority');
          const filterStatus = document.getElementById('filterStatus');
           const clearFilters = document.getElementById('clearFilters');
        const toggleAuthFormButton = document.getElementById('toggleAuthForm');



        function showNotification(message) {
              notificationArea.textContent = message;
               setTimeout(() => notificationArea.textContent = "", 5000)
        }
        function toggleAuthForm() {
           const registerDisplay = registerForm.style.display === 'none';
            registerForm.style.display = registerDisplay ? 'flex' : 'none';
            loginForm.style.display = registerDisplay ? 'none' : 'flex';
            toggleAuthFormButton.textContent = registerDisplay ? 'Switch to Register' : 'Switch to Login';

        }
       toggleAuthFormButton.addEventListener('click', toggleAuthForm);

       function handleRegistration(event) {
           event.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
             const registerError = document.getElementById('registerError');

          if(!username || !password) {
            registerError.textContent = "Please enter a username and password";
              return;
          }
           if(localStorage.getItem(username)){
             registerError.textContent = "Username already exists!";
                return;
           }


           localStorage.setItem(username, password);
            document.getElementById('registerUsername').value = "";
            document.getElementById('registerPassword').value = "";
           registerError.textContent = "";

           showNotification("Registration successful! Please log in");
            toggleAuthForm();


       }

         function handleLogin(event) {
              event.preventDefault();
              const username = document.getElementById('loginUsername').value;
             const password = document.getElementById('loginPassword').value;
              const loginError = document.getElementById('loginError');

            if(!username || !password) {
             loginError.textContent = "Please enter a username and password";
              return;
           }

            const storedPassword = localStorage.getItem(username);
            if(storedPassword !== password) {
               loginError.textContent = "Invalid username or password";
                 return;
            }

            currentUser = username;
            loginError.textContent = "";
           authSection.style.display = 'none';
            taskSection.style.display = 'block';
             showNotification("Logged in as " + currentUser);
           loadTasks();


         }

       registerForm.querySelector('button').addEventListener('click', handleRegistration);
        loginForm.querySelector('button').addEventListener('click', handleLogin);


        function loadTasks() {
            const storedTasks = localStorage.getItem(`tasks-${currentUser}`);
            tasks = storedTasks ? JSON.parse(storedTasks) : [];
            renderTasks();
             checkNotifications();
        }

         function saveTasks() {
            localStorage.setItem(`tasks-${currentUser}`, JSON.stringify(tasks));
         }



        function addTask(event) {
            event.preventDefault();
              const title = document.getElementById('taskTitle').value;
             const description = document.getElementById('taskDescription').value;
             const category = document.getElementById('taskCategory').value;
             const dueDate = document.getElementById('taskDueDate').value;
              const priority = document.getElementById('taskPriority').value;


              const newTask = {
                   id: Date.now(),
                  title: title,
                  description: description,
                  category: category,
                   dueDate: dueDate,
                   priority: priority,
                   status: "Pending"

              };
              tasks.push(newTask);
              saveTasks();
              renderTasks();
             taskForm.reset();
        }
        taskForm.addEventListener('submit', addTask);

        function renderTasks() {
            taskList.innerHTML = '';
           const filteredTasks = getFilteredTasks();

           if(filteredTasks.length === 0) {
             taskList.innerHTML = '<li> No tasks found.</li>';
             return;
           }

           filteredTasks.forEach(task => {
               const taskItem = document.createElement('li');
                taskItem.innerHTML = `
                    <span><strong>${task.title}</strong> - ${task.category} - ${task.priority}
                    ${task.dueDate ? ' - Due: ' + new Date(task.dueDate).toLocaleDateString() : ''}
                     - Status: ${task.status}
                     ${task.description ? '<br><small>' + task.description + '</small>' : ''}
                     </span>
                    <div class="task-actions">
                        <button class="edit" data-id="${task.id}">Edit</button>
                         <button class="complete" data-id="${task.id}">Complete</button>
                        <button data-id="${task.id}">Delete</button>
                    </div>
                `;
                 taskList.appendChild(taskItem);
           });


        }

        function editTask(id){
             const taskIndex = tasks.findIndex(task => task.id === Number(id));
              if(taskIndex === -1) { return; }


              const task = tasks[taskIndex];
                const title = prompt("Edit Task Title", task.title);
                 const description = prompt("Edit Description", task.description);
                 const category = prompt("Edit Category", task.category);
                 const dueDate = prompt("Edit Due Date (YYYY-MM-DD)", task.dueDate);
                const priority = prompt("Edit Priority", task.priority);


                 if(title !== null && title.trim() !== '') {
                     task.title = title;
                    task.description = description;
                     task.category = category;
                     task.dueDate = dueDate;
                    task.priority = priority;

                     saveTasks();
                     renderTasks();
                 }


        }

        function completeTask(id) {
          const taskIndex = tasks.findIndex(task => task.id === Number(id));
          if(taskIndex === -1) {
              return;
           }
            tasks[taskIndex].status = "Completed";
              saveTasks();
              renderTasks();
        }

        function deleteTask(id) {
             const taskIndex = tasks.findIndex(task => task.id === Number(id));
              if(taskIndex !== -1) {
                 tasks.splice(taskIndex, 1);
                 saveTasks();
                 renderTasks();
             }

        }


        taskList.addEventListener('click', (event) => {
            if(event.target.tagName === 'BUTTON'){
                const taskId = event.target.getAttribute('data-id');
                 if(event.target.classList.contains('edit')) {
                       editTask(taskId);

                } else if (event.target.classList.contains('complete')){
                       completeTask(taskId);
                }
                else {
                    deleteTask(taskId);
                }

            }

        });

    function getFilteredTasks() {
       let filteredTasks = [...tasks];
         if(filterCategory.value){
             filteredTasks = filteredTasks.filter(task => task.category === filterCategory.value);
         }
        if (filterPriority.value) {
           filteredTasks = filteredTasks.filter(task => task.priority === filterPriority.value);
        }
        if(filterStatus.value) {
            filteredTasks = filteredTasks.filter(task => task.status === filterStatus.value);
        }
           return filteredTasks;

    }

    function handleFilterChange() {
          renderTasks();
    }

    filterCategory.addEventListener('change', handleFilterChange);
    filterPriority.addEventListener('change', handleFilterChange);
     filterStatus.addEventListener('change', handleFilterChange);

     clearFilters.addEventListener('click', () => {
       filterCategory.value = "";
        filterPriority.value = "";
        filterStatus.value = "";
        renderTasks();
     })

    function checkNotifications() {
        const now = new Date();
        tasks.forEach(task => {
           if(task.dueDate) {
              const dueDate = new Date(task.dueDate);
               const timeDiff = dueDate.getTime() - now.getTime();
              const daysLeft = Math.ceil(timeDiff / (1000 * 3600 * 24));

               if(daysLeft === 0) {
                   showNotification(`Task ${task.title} is due today`);
               }else if (daysLeft < 0 ) {
                     showNotification(`Task ${task.title} is overdue!`);
               }
                else if (daysLeft <= 2){
                     showNotification(`Task ${task.title} is due in ${daysLeft} days`);

                }
           }

        });
    }


    </script>
</body>
</html>
